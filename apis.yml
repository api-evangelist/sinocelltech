description: Sinocelltech (Beijing Sino Cell Biotechnology Group Co., Ltd.; Shanghai
  Stock Exchange STAR Market code 688520) is a biopharmaceutical research and development
  company founded in 2002 by Dr. Xie Liangzhi. It develops and commercializes recombinant
  protein and monoclonal antibody therapeutics across oncology, autoimmune disease,
  and infectious disease, together with preventive vaccines including a recombinant
  14-valent HPV vaccine and COVID-19 vaccines. The company has multiple marketed products
  in China and a pipeline of clinical-stage candidates. It publishes no public developer
